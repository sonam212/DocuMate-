{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-6 col-sm-8">
        <div class="auth-card">
            <div class="card-body">
                <h3 class="text-center fw-bold fst-italic text-primary mb-4">
                    📝 Register
                </h3>
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold fst-italic">Username</label>
                        <input type="text" name="username" class="form-control" id="username" placeholder="Choose a username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold fst-italic">Email</label>
                        <input type="email" name="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold fst-italic">Password</label>
                        <input type="password" name="password" class="form-control" id="password" placeholder="Enter your password" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label fw-bold fst-italic">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" id="confirm_password" placeholder="Re-enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold fst-italic">Register</button>
                </form>
                <p class="text-center mt-3">
                    <small>Already have an account?
                        <a href="{{ url_for('login') }}" class="fw-bold fst-italic text-primary">Login</a>
                    </small>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
